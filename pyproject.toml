[project]
name = "tester"
version = "0.1.0"
description = "Fixture repository for issue-follower pipeline tests"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
